# @see https://github.com/ikselven/horde-satis.maintaina.com/blob/10030e3fbca81579dfd8ea2385d2291663b8bcbd/.github/workflows/horde-satis.yml
name: Satis Build
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main
env:
  BUILD_DIR: build

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create composer.json
        run: echo "{}" > composer.json

      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u "+%F")" >> $GITHUB_OUTPUT

      - name: Cache dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.composer
            ${{ env.BUILD_DIR }}
          key: ${{ runner.os }}-php-${{ steps.get-date.outputs.date }}
          restore-keys: ${{ runner.os }}-php-

      - name: Mint private packages token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PACKAGIST_APP_ID }}
          private-key: ${{ secrets.PACKAGIST_APP_PRIVATE_KEY }}
          owner: gppackagist

      - name: Docker pull
        run: docker pull composer/satis

      # COMPOSER_AUTH instead of `composer config -g`, which would write the token into the cached ~/.composer
      - name: Docker build
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ steps.app-token.outputs.token }}"}}'
        run: |
          mkdir -p "$HOME/.composer"
          rm -f "$HOME/.composer/auth.json"
          docker run --rm --init \
            --user $(id -u):$(id -g) \
            --volume $(pwd):/build \
            --volume "$HOME/.composer:/composer" \
            --env COMPOSER_AUTH \
            composer/satis -vvv build /build/satis.json /build/${{ env.BUILD_DIR }} --no-interaction

      - name: Publish to GitHub pages
        run: |
          rm composer.json
          git checkout gh-pages
          rm -rf include/*
          cp -R ${{ env.BUILD_DIR }}/* .
          rm -rf ${{ env.BUILD_DIR }}/
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git diff --cached --quiet || { git commit -m "Updated repository" && git push; }
